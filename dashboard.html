<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geo-Distributed Rate Limiter · Dashboard</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e5e7eb;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

    /* ── Gradient mesh background blobs ───────────────────────────────────── */
    @keyframes meshFloat1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33%     { transform: translate(3%,2%) scale(1.06); }
      66%     { transform: translate(-2%,4%) scale(0.97); }
    }
    @keyframes meshFloat2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%     { transform: translate(-5%,-3%) scale(1.04); }
      70%     { transform: translate(3%,-2%) scale(1.08); }
    }
    @keyframes meshFloat3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%     { transform: translate(4%,-5%) scale(1.1); }
    }

    /* ── Decision row slide-in ────────────────────────────────────────────── */
    @keyframes slideInRight {
      from { transform: translateX(18px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .row-new { animation: slideInRight 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }

    /* ── Overrides panel glow (border beam) ───────────────────────────────── */
    @keyframes overrideGlow {
      0%,100% { box-shadow: 0 0 0 1px #f59e0b28, 0 0 16px #f59e0b0a; }
      50%     { box-shadow: 0 0 0 1px #f59e0b66, 0 0 24px #f59e0b1a; }
    }
    .override-active { animation: overrideGlow 2.5s ease-in-out infinite; }

    /* ── Connection dot pulse ─────────────────────────────────────────────── */
    @keyframes dotPulse {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="loading-fallback" style="display:flex;align-items:center;justify-content:center;height:100vh;color:#333;font-family:monospace;font-size:13px;flex-direction:column;gap:12px;">
    <div>Loading dashboard…</div>
    <div id="fallback-error" style="color:#ef4444;font-size:11px;display:none;max-width:500px;text-align:center;line-height:1.6;"></div>
  </div>
  <div id="root"></div>

  <!--
    Load order is critical — Recharts UMD reads window.React, window.PropTypes, window.ReactDOM.
    Babel processes <script type="text/babel"> tags the moment it finishes loading,
    so everything it needs must already be on window before Babel's <script> tag.
  -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.0/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;

    if (!window.Recharts) {
      const el = document.getElementById('fallback-error');
      if (el) { el.style.display = 'block'; el.textContent = 'Recharts CDN failed — check network and reload.'; }
      throw new Error('Recharts not loaded');
    }
    const { LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } = Recharts;

    // ─── Config ───────────────────────────────────────────────────────────────
    const API        = 'http://localhost:5001';
    const REFRESH_MS = 5000;

    // ─── Data fetching ────────────────────────────────────────────────────────
    async function fetchAll() {
      const [metrics, decisions, overrides, counters] = await Promise.allSettled([
        fetch(`${API}/api/metrics`).then(r => { if (!r.ok) throw r; return r.json(); }),
        fetch(`${API}/api/decisions`).then(r => { if (!r.ok) throw r; return r.json(); }),
        fetch(`${API}/api/overrides`).then(r => { if (!r.ok) throw r; return r.json(); }),
        fetch(`${API}/api/counters`).then(r => { if (!r.ok) throw r; return r.json(); }),
      ]);
      return {
        ok:        metrics.status   === 'fulfilled',
        metrics:   metrics.status   === 'fulfilled' ? metrics.value   : null,
        decisions: decisions.status === 'fulfilled' ? decisions.value : [],
        overrides: overrides.status === 'fulfilled' ? overrides.value : [],
        counters:  counters.status  === 'fulfilled' ? counters.value  : [],
      };
    }

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString('en-US', {
        hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    }

    function fmtNum(n, decimals = 0) {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-US', { maximumFractionDigits: decimals });
    }

    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

    // ─── useAnimatedNumber ────────────────────────────────────────────────────
    // Smoothly interpolates from the previous value to the next on every update.
    function useAnimatedNumber(target, duration = 800) {
      const [display, setDisplay] = useState(target ?? 0);
      const fromRef = useRef(target ?? 0);
      const rafRef  = useRef(null);

      useEffect(() => {
        const from = fromRef.current;
        const to   = target ?? 0;
        if (from === to) return;

        const start = performance.now();
        const tick  = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          setDisplay(from + (to - from) * easeOutCubic(progress));
          if (progress < 1) rafRef.current = requestAnimationFrame(tick);
          else fromRef.current = to;
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
      }, [target, duration]);

      return display;
    }

    // ─── Small UI atoms ───────────────────────────────────────────────────────
    const REGION_COLOR = { us: '#10b981', eu: '#3b82f6', asia: '#a855f7' };
    const TIER_COLOR   = { free: '#6b7280', premium: '#f59e0b', internal: '#10b981' };

    function Pill({ children, color = '#ffffff14', text = '#666' }) {
      return (
        <span style={{ background: color, color: text, fontSize: 10, fontWeight: 700,
          padding: '2px 8px', borderRadius: 20, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          {children}
        </span>
      );
    }

    function TypeBadge({ type }) {
      const s = type === 'override'
        ? { bg: '#f59e0b18', txt: '#f59e0b' }
        : { bg: '#3b82f618', txt: '#3b82f6' };
      return (
        <span style={{ background: s.bg, color: s.txt, fontSize: 10, fontWeight: 700,
          padding: '2px 7px', borderRadius: 4, textTransform: 'uppercase',
          letterSpacing: '0.05em', border: `1px solid ${s.txt}28` }}>
          {type}
        </span>
      );
    }

    function RegionBadge({ region }) {
      return (
        <span style={{ color: REGION_COLOR[region] || '#888', fontSize: 11, fontWeight: 700 }}>
          {region?.toUpperCase() ?? '—'}
        </span>
      );
    }

    function TierBadge({ tier }) {
      return <span style={{ color: TIER_COLOR[tier] || '#888', fontSize: 11 }}>{tier ?? '—'}</span>;
    }

    function TTLCell({ ttl }) {
      if (ttl == null || ttl < 0) return <span style={{ color: '#444' }}>∞</span>;
      const color = ttl > 300 ? '#10b981' : ttl > 60 ? '#f59e0b' : '#ef4444';
      const m = Math.floor(ttl / 60), s = ttl % 60;
      return (
        <span style={{ color, fontFamily: 'monospace', fontSize: 12, fontWeight: 600 }}>
          {m > 0 ? `${m}m ` : ''}{String(s).padStart(2, '0')}s
        </span>
      );
    }

    // ─── Skeleton ─────────────────────────────────────────────────────────────
    function Skeleton({ h = 16, w = '100%', r = 4 }) {
      return (
        <div style={{ height: h, width: w, borderRadius: r,
          background: 'linear-gradient(90deg,#1c1c1c 25%,#262626 50%,#1c1c1c 75%)',
          backgroundSize: '400% 100%' }} />
      );
    }

    // ─── Sparkline (Recharts) ─────────────────────────────────────────────────
    function Sparkline({ data, color }) {
      if (!data || data.length < 2) {
        return <div style={{ height: 44, display:'flex', alignItems:'center' }}><Skeleton h={2} r={1} /></div>;
      }
      const pts = data.map((d, i) => ({ i, v: typeof d === 'object' ? (d.v ?? 0) : Number(d) }));
      return (
        <ResponsiveContainer width="100%" height={44}>
          <LineChart data={pts} margin={{ top: 4, right: 2, bottom: 0, left: 2 }}>
            <Line type="monotone" dataKey="v" stroke={color} dot={false}
              strokeWidth={1.5} isAnimationActive={false} />
          </LineChart>
        </ResponsiveContainer>
      );
    }

    // ─── Panel shell ──────────────────────────────────────────────────────────
    function Panel({ children, className = '', style = {} }) {
      return (
        <div className={className} style={{ background: '#1a1a1a', border: '1px solid #222',
          borderRadius: 12, display: 'flex', flexDirection: 'column', overflow: 'hidden', ...style }}>
          {children}
        </div>
      );
    }

    function PanelHeader({ title, badge }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '14px 20px', borderBottom: '1px solid #1d1d1d', flexShrink: 0 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: '#e5e7eb', letterSpacing: '-0.01em' }}>
            {title}
          </span>
          {badge}
        </div>
      );
    }

    // ─── Table shell ──────────────────────────────────────────────────────────
    function DataTable({ cols, rows, empty }) {
      if (!rows || rows.length === 0) {
        return (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center',
            padding:'48px 0', color:'#3a3a3a', fontSize:13 }}>
            {empty}
          </div>
        );
      }
      return (
        <div style={{ overflowY:'auto', flex:1 }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr style={{ background:'#111', position:'sticky', top:0, zIndex:1 }}>
                {cols.map(c => (
                  <th key={c} style={{ padding:'8px 14px', textAlign:'left', fontSize:10,
                    color:'#404040', fontWeight:700, textTransform:'uppercase',
                    letterSpacing:'0.08em', whiteSpace:'nowrap' }}>
                    {c}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>{rows}</tbody>
          </table>
        </div>
      );
    }

    function TD({ children, mono = false, mw }) {
      return (
        <td style={{ padding:'9px 14px', fontSize:12, borderBottom:'1px solid #1c1c1c',
          color:'#c4c8cc', fontFamily: mono ? 'ui-monospace,SFMono-Regular,Menlo,monospace' : undefined,
          maxWidth: mw, overflow: mw ? 'hidden' : undefined,
          textOverflow: mw ? 'ellipsis' : undefined, whiteSpace: mw ? 'nowrap' : undefined }}>
          {children}
        </td>
      );
    }

    // ─── Metric Card (animated counter) ──────────────────────────────────────
    function MetricCard({ title, rawValue, decimals = 0, unit, sub, color, spark, loading, isInt = false }) {
      const animated = useAnimatedNumber(rawValue ?? 0, 900);
      const display  = rawValue == null ? '—'
        : isInt  ? Math.round(animated).toLocaleString()
        : animated.toFixed(decimals);

      return (
        <div style={{ background:'#1a1a1a', border:'1px solid #222', borderRadius:12,
          padding:'20px 20px 14px', display:'flex', flexDirection:'column', gap:4 }}>
          {/* header row */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
            <span style={{ fontSize:11, color:'#505050', fontWeight:600,
              textTransform:'uppercase', letterSpacing:'0.06em' }}>
              {title}
            </span>
            <div style={{ width:8, height:8, borderRadius:'50%', background:color,
              boxShadow:`0 0 7px ${color}99` }} />
          </div>
          {/* value */}
          <div style={{ display:'flex', alignItems:'baseline', gap:5, marginTop:4 }}>
            {loading
              ? <Skeleton h={32} w={80} r={6} />
              : <span style={{ fontSize:30, fontWeight:700, color:'#f3f4f6',
                  letterSpacing:'-0.03em', lineHeight:1, fontVariantNumeric:'tabular-nums' }}>
                  {display}
                </span>
            }
            {unit && !loading && <span style={{ fontSize:13, color:'#4a4a4a' }}>{unit}</span>}
          </div>
          {sub && !loading && <span style={{ fontSize:11, color:'#404040' }}>{sub}</span>}
          {/* sparkline */}
          <div style={{ marginTop:6 }}>
            {loading ? <Skeleton h={44} r={3} /> : <Sparkline data={spark} color={color} />}
          </div>
        </div>
      );
    }

    // ─── Decisions Feed (slide-in for new rows) ───────────────────────────────
    function DecisionsFeed({ decisions, loading }) {
      const seenRef = useRef(new Set());
      const [newKeys, setNewKeys] = useState(new Set());

      useEffect(() => {
        if (!decisions.length) return;
        const incoming = new Set();
        decisions.forEach(d => {
          const k = `${d.tick}-${d.type}-${d.user_id}-${d.limit_per_minute}`;
          if (!seenRef.current.has(k)) { incoming.add(k); seenRef.current.add(k); }
        });
        if (incoming.size) {
          setNewKeys(incoming);
          const t = setTimeout(() => setNewKeys(new Set()), 500);
          return () => clearTimeout(t);
        }
      }, [decisions]);

      const badge = <Pill color="#10b98118" text="#10b981">{decisions.length} recent</Pill>;

      const rows = decisions.map((d, i) => {
        const k      = `${d.tick}-${d.type}-${d.user_id}-${d.limit_per_minute}`;
        const isNew  = newKeys.has(k);
        return (
          <tr key={k + i} className={isNew ? 'row-new' : ''}>
            <TD mono>{fmtTime(d.ts)}</TD>
            <TD><TypeBadge type={d.type} /></TD>
            <TD><RegionBadge region={d.region} /></TD>
            <TD><TierBadge tier={d.tier} /></TD>
            <TD mono>
              {d.limit_per_minute != null
                ? <>{fmtNum(d.limit_per_minute)}<span style={{ fontSize:9, color:'#444', marginLeft:2 }}>/min</span></>
                : <span style={{ color:'#333' }}>—</span>}
            </TD>
            <TD mw={220}>
              <span title={d.reason} style={{ color:'#777', fontSize:11 }}>
                {d.user_id
                  ? <><span style={{ color:'#bbb', fontFamily:'monospace' }}>{d.user_id}</span>{' · '}</>
                  : null}
                {d.reason}
              </span>
            </TD>
          </tr>
        );
      });

      return (
        <Panel>
          <PanelHeader title="Live Agent Decisions" badge={badge} />
          {loading
            ? <div style={{ padding:'20px', display:'flex', flexDirection:'column', gap:10 }}>
                {[...Array(6)].map((_, i) => <Skeleton key={i} h={14} w={`${65 + i * 4}%`} />)}
              </div>
            : <DataTable cols={['Time','Type','Region','Tier','Limit','Details']}
                rows={rows} empty="No agent decisions recorded yet" />}
        </Panel>
      );
    }

    // ─── Overrides Table (border beam glow) ───────────────────────────────────
    function OverridesTable({ overrides, loading }) {
      const hasOverrides = overrides.length > 0;
      const badge = hasOverrides
        ? <Pill color="#f59e0b18" text="#f59e0b">{overrides.length} active</Pill>
        : <Pill>0 active</Pill>;

      const rows = overrides.map((ov, i) => (
        <tr key={i}>
          <TD mono>{ov.user_id}</TD>
          <TD mono>
            {ov.limit != null
              ? <span style={{ color:'#f59e0b' }}>{fmtNum(ov.limit)}<span style={{ fontSize:9, color:'#555', marginLeft:2 }}>/min</span></span>
              : <span style={{ color:'#333' }}>—</span>}
          </TD>
          <TD><RegionBadge region={ov.region} /></TD>
          <TD><TTLCell ttl={ov.ttl} /></TD>
          <TD mw={160}><span title={ov.reason} style={{ color:'#666', fontSize:11 }}>{ov.reason}</span></TD>
        </tr>
      ));

      return (
        <Panel className={hasOverrides ? 'override-active' : ''}>
          <PanelHeader title="Active Overrides" badge={badge} />
          {loading
            ? <div style={{ padding:'20px', display:'flex', flexDirection:'column', gap:10 }}>
                {[...Array(4)].map((_, i) => <Skeleton key={i} h={14} w={`${55 + i * 10}%`} />)}
              </div>
            : <DataTable cols={['User ID','Limit','Region','TTL','Reason']}
                rows={rows} empty="No active user overrides" />}
        </Panel>
      );
    }

    // ─── G-Counter Chart (Recharts BarChart) ──────────────────────────────────
    const SLOT_COLORS = ['#10b981', '#3b82f6', '#a855f7'];

    function CounterChart({ counters, loading }) {
      const top  = counters.slice(0, 10);
      const data = top.map(c => ({
        name: c.user_id.length > 11 ? c.user_id.slice(0, 10) + '…' : c.user_id,
        US: c.us, EU: c.eu, Asia: c.asia,
      }));

      const legend = (
        <div style={{ display:'flex', gap:14 }}>
          {['US','EU','Asia'].map((r, i) => (
            <div key={r} style={{ display:'flex', alignItems:'center', gap:5 }}>
              <div style={{ width:8, height:8, borderRadius:2, background:SLOT_COLORS[i] }} />
              <span style={{ fontSize:10, color:'#505050' }}>{r}</span>
            </div>
          ))}
        </div>
      );

      return (
        <Panel>
          <PanelHeader title="G-Counter Slot Distribution" badge={legend} />
          <div style={{ padding:'14px 8px 12px', flex:1 }}>
            {loading ? (
              <div style={{ padding:'0 12px', display:'flex', flexDirection:'column', gap:10 }}>
                {[...Array(5)].map((_, i) => <Skeleton key={i} h={18} w={`${35 + i * 12}%`} />)}
              </div>
            ) : top.length === 0 ? (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'center',
                height:200, color:'#3a3a3a', fontSize:13 }}>
                No counter data — start the traffic simulator
              </div>
            ) : (
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={data} barSize={8} barCategoryGap="28%"
                  margin={{ top:4, right:8, bottom:0, left:-16 }}>
                  <XAxis dataKey="name"
                    tick={{ fill:'#4a4a4a', fontSize:10, fontFamily:'monospace' }}
                    axisLine={false} tickLine={false} />
                  <YAxis tick={{ fill:'#404040', fontSize:10 }}
                    axisLine={false} tickLine={false} />
                  <Tooltip
                    contentStyle={{ background:'#111', border:'1px solid #222',
                      borderRadius:8, fontSize:11, padding:'8px 12px' }}
                    labelStyle={{ color:'#888', marginBottom:4 }}
                    itemStyle={{ color:'#ccc' }}
                    cursor={{ fill:'#ffffff06' }}
                  />
                  {['US','EU','Asia'].map((key, i) => (
                    <Bar key={key} dataKey={key} fill={SLOT_COLORS[i]}
                      radius={[2,2,0,0]} isAnimationActive={true}
                      animationDuration={600} animationEasing="ease-out" />
                  ))}
                </BarChart>
              </ResponsiveContainer>
            )}
          </div>
        </Panel>
      );
    }

    // ─── Top Active Users ─────────────────────────────────────────────────────
    function TopUsers({ counters, loading }) {
      const max = counters.length > 0 ? counters[0].total : 1;

      return (
        <Panel>
          <PanelHeader title="Top Active Users"
            badge={<span style={{ fontSize:11, color:'#404040' }}>by CRDT total</span>} />
          {loading ? (
            <div style={{ padding:'12px 20px', display:'flex', flexDirection:'column', gap:12 }}>
              {[...Array(8)].map((_, i) => <Skeleton key={i} h={28} />)}
            </div>
          ) : counters.length === 0 ? (
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center',
              padding:'48px 0', color:'#3a3a3a', fontSize:13 }}>
              No active users — start the traffic simulator
            </div>
          ) : (
            <div style={{ overflowY:'auto', flex:1, padding:'6px 0' }}>
              {counters.slice(0, 15).map((c, i) => {
                const pct = Math.round((c.total / max) * 100);
                const tc  = TIER_COLOR[c.tier] || '#888';
                return (
                  <div key={i} style={{ padding:'8px 20px', borderBottom:'1px solid #1c1c1c' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <span style={{ fontSize:10, color:'#2e2e2e', width:18, textAlign:'right' }}>{i + 1}</span>
                        <span style={{ fontSize:12, color:'#ccc', fontFamily:'monospace' }}>{c.user_id}</span>
                        <span style={{ fontSize:10, color:tc, fontWeight:600 }}>{c.tier}</span>
                      </div>
                      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                        <span style={{ fontSize:10, color:'#383838' }}>
                          {[c.us > 0 && `US:${c.us}`, c.eu > 0 && `EU:${c.eu}`, c.asia > 0 && `AS:${c.asia}`]
                            .filter(Boolean).join(' ')}
                        </span>
                        <span style={{ fontSize:12, color:'#aaa', fontFamily:'monospace', minWidth:48, textAlign:'right' }}>
                          {fmtNum(c.total)}
                        </span>
                      </div>
                    </div>
                    <div style={{ height:3, background:'#1e1e1e', borderRadius:2, marginLeft:26 }}>
                      <div style={{ height:'100%', width:`${pct}%`, background:'#3b82f6',
                        borderRadius:2, transition:'width 0.5s ease' }} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Panel>
      );
    }

    // ─── Animated gradient mesh background ────────────────────────────────────
    function GradientBackground() {
      return (
        <div style={{ position:'fixed', inset:0, zIndex:0, pointerEvents:'none', overflow:'hidden' }}>
          <div style={{
            position:'absolute', top:'-25%', left:'-15%', width:'55%', height:'55%',
            background:'radial-gradient(ellipse at center, #0d1f3c 0%, transparent 68%)',
            animation:'meshFloat1 22s ease-in-out infinite', willChange:'transform',
          }} />
          <div style={{
            position:'absolute', bottom:'-20%', right:'-10%', width:'50%', height:'50%',
            background:'radial-gradient(ellipse at center, #1a0d2e 0%, transparent 68%)',
            animation:'meshFloat2 28s ease-in-out infinite', willChange:'transform',
          }} />
          <div style={{
            position:'absolute', top:'35%', left:'25%', width:'45%', height:'45%',
            background:'radial-gradient(ellipse at center, #0a1f12 0%, transparent 68%)',
            animation:'meshFloat3 19s ease-in-out infinite', willChange:'transform',
          }} />
        </div>
      );
    }

    // ─── Header ───────────────────────────────────────────────────────────────
    function Header({ connected, lastUpdate }) {
      return (
        <div style={{ background:'#0e0e0ecc', backdropFilter:'blur(12px)',
          borderBottom:'1px solid #1a1a1a', padding:'14px 32px',
          display:'flex', justifyContent:'space-between', alignItems:'center',
          position:'sticky', top:0, zIndex:100 }}>
          <div>
            <h1 style={{ fontSize:17, fontWeight:700, color:'#f9fafb', letterSpacing:'-0.02em',
              background:'linear-gradient(90deg, #e5e7eb 60%, #6b7280)',
              WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
              Geo-Distributed Rate Limiter
            </h1>
            <p style={{ fontSize:11, color:'#383838', marginTop:2 }}>
              AI-powered traffic control · 3-region cluster · CRDT sync
            </p>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:20 }}>
            {lastUpdate && (
              <span style={{ fontSize:11, color:'#333' }}>
                Updated {fmtTime(lastUpdate)}
              </span>
            )}
            <div style={{ display:'flex', alignItems:'center', gap:7 }}>
              <div style={{
                width:7, height:7, borderRadius:'50%',
                background: connected ? '#10b981' : '#ef4444',
                boxShadow: connected ? '0 0 8px #10b981bb' : 'none',
                animation: connected ? 'dotPulse 2.5s ease-in-out infinite' : 'none',
              }} />
              <span style={{ fontSize:12, color: connected ? '#10b981' : '#ef4444' }}>
                {connected ? 'Live' : 'Disconnected'}
              </span>
            </div>
          </div>
        </div>
      );
    }

    // ─── Footer ───────────────────────────────────────────────────────────────
    function Footer({ connected }) {
      return (
        <div style={{ textAlign:'center', padding:'20px 0 28px',
          borderTop:'1px solid #131313', marginTop:8 }}>
          <span style={{ fontSize:11, color:'#242424' }}>
            Geo-Distributed Rate Limiter · CMPE 273 · Refreshes every 5s · {connected ? '● Live' : '○ Offline'}
          </span>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────
    function App() {
      const [state, setState] = useState({
        metrics: null, decisions: [], overrides: [], counters: [],
        connected: false, loading: true, lastUpdate: null,
      });

      const load = useCallback(async () => {
        try {
          const result = await fetchAll();
          setState(prev => ({
            ...prev, ...result,
            connected: result.ok, loading: false, lastUpdate: Date.now(),
          }));
        } catch {
          setState(prev => ({ ...prev, connected: false, loading: false }));
        }
      }, []);

      useEffect(() => {
        load();
        const id = setInterval(load, REFRESH_MS);
        return () => clearInterval(id);
      }, [load]);

      const { metrics, decisions, overrides, counters, connected, loading, lastUpdate } = state;

      const rpsSpk   = metrics?.sparklines?.rps        ?? [];
      const allowSpk = metrics?.sparklines?.allow_rate ?? [];
      const usersSpk = metrics?.sparklines?.users      ?? [];

      return (
        <div style={{ minHeight:'100vh', background:'#0a0a0a', position:'relative' }}>
          <GradientBackground />

          {/* All content sits above the background */}
          <div style={{ position:'relative', zIndex:1 }}>
            <Header connected={connected} lastUpdate={lastUpdate} />

            <div style={{ maxWidth:1600, margin:'0 auto',
              padding:'24px 32px 0', display:'flex', flexDirection:'column', gap:16 }}>

              {/* Hero — 4 metric cards */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14 }}>
                <MetricCard title="Total RPS"
                  rawValue={metrics?.total_rps ?? null} decimals={1} unit="req/s"
                  sub="across all regions" color="#10b981"
                  spark={rpsSpk} loading={loading} />
                <MetricCard title="Allow Rate"
                  rawValue={metrics?.allow_rate ?? null} decimals={1} unit="%"
                  sub="of all requests" color="#3b82f6"
                  spark={allowSpk} loading={loading} />
                <MetricCard title="Active Users"
                  rawValue={metrics?.active_users ?? null} isInt
                  sub="with counter data" color="#a855f7"
                  spark={usersSpk} loading={loading} />
                <MetricCard title="AI Decisions"
                  rawValue={metrics?.recent_decisions ?? null} isInt
                  sub="last 24 hours" color="#f59e0b"
                  spark={[]} loading={loading} />
              </div>

              {/* Row 1 — Decisions (60%) + Overrides (40%) */}
              <div style={{ display:'grid', gridTemplateColumns:'3fr 2fr', gap:14 }}>
                <DecisionsFeed decisions={decisions} loading={loading} />
                <OverridesTable overrides={overrides} loading={loading} />
              </div>

              {/* Row 2 — G-Counter chart (50%) + Top users (50%) */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
                <CounterChart counters={counters} loading={loading} />
                <TopUsers counters={counters} loading={loading} />
              </div>
            </div>

            <Footer connected={connected} />
          </div>
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────────────────
    try {
      const fallback = document.getElementById('loading-fallback');
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      if (fallback) fallback.style.display = 'none';
    } catch (err) {
      const el = document.getElementById('fallback-error');
      if (el) { el.style.display = 'block'; el.textContent = 'React mount error: ' + err.message; }
      console.error('React mount failed:', err);
    }
  </script>
</body>
</html>

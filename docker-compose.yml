services:
  redis-us:
    image: redis:7-alpine
    container_name: redis-us
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "no"]

  redis-eu:
    image: redis:7-alpine
    container_name: redis-eu
    ports: ["6380:6379"]
    command: ["redis-server", "--appendonly", "no"]

  redis-asia:
    image: redis:7-alpine
    container_name: redis-asia
    ports: ["6381:6379"]
    command: ["redis-server", "--appendonly", "no"]

  gateway-us:
    build: ./gateway
    container_name: gateway-us
    ports: ["8081:8080"]
    environment:
      - REGION=us
      - REDIS_ADDR=redis-us:6379
      - GIN_MODE=release
    depends_on: [redis-us]

  gateway-eu:
    build: ./gateway
    container_name: gateway-eu
    ports: ["8082:8080"]
    environment:
      - REGION=eu
      - REDIS_ADDR=redis-eu:6379
      - GIN_MODE=release
    depends_on: [redis-eu]

  gateway-asia:
    build: ./gateway
    container_name: gateway-asia
    ports: ["8083:8080"]
    environment:
      - REGION=asia
      - REDIS_ADDR=redis-asia:6379
      - GIN_MODE=release
    depends_on: [redis-asia]

  sync-us:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: sync-us
    environment:
      REGION: us
      LOCAL_REDIS_ADDR: redis-us:6379
      PEER_REDIS_EU_ADDR: redis-eu:6379
      PEER_REDIS_ASIA_ADDR: redis-asia:6379
      ADMIN_PORT: "8001"
      METRICS_PORT: "9101"
      RECONCILE_INTERVAL_SEC: "30"
    ports:
      - "8011:8001"
      - "9111:9101"
    depends_on: [redis-us, redis-eu, redis-asia]
    restart: on-failure

  sync-eu:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: sync-eu
    environment:
      REGION: eu
      LOCAL_REDIS_ADDR: redis-eu:6379
      PEER_REDIS_US_ADDR: redis-us:6379
      PEER_REDIS_ASIA_ADDR: redis-asia:6379
      ADMIN_PORT: "8001"
      METRICS_PORT: "9101"
      RECONCILE_INTERVAL_SEC: "30"
    ports:
      - "8012:8001"
      - "9112:9101"
    depends_on: [redis-us, redis-eu, redis-asia]
    restart: on-failure

  sync-asia:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: sync-asia
    environment:
      REGION: asia
      LOCAL_REDIS_ADDR: redis-asia:6379
      PEER_REDIS_US_ADDR: redis-us:6379
      PEER_REDIS_EU_ADDR: redis-eu:6379
      ADMIN_PORT: "8001"
      METRICS_PORT: "9101"
      RECONCILE_INTERVAL_SEC: "30"
    ports:
      - "8013:8001"
      - "9113:9101"
    depends_on: [redis-us, redis-eu, redis-asia]
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on: [prometheus]

networks:
  default:
    name: georl_net
